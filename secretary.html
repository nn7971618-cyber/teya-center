<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>واجهة السكرتارية الفاخرة | سنتر TEYA</title>
<style>
:root { --teya-navy: #0e3150; --teya-gold: #f2be5c; --bg-gradient: #f8fafc; --card-shadow: 0 10px 30px rgba(14, 49, 80, 0.05); }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { background-color: var(--bg-gradient); color: #334155; padding: 30px 20px; }
.container { max-width: 650px; margin: 0 auto; }
header { background: linear-gradient(135deg, var(--teya-navy), #1a4a75); padding: 25px 35px; border-radius: 16px; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(14, 49, 80, 0.15); position: relative; overflow: hidden; text-align: center; }
header::after { content: ''; position: absolute; top: 0; right: 0; width: 8px; height: 100%; background-color: var(--teya-gold); }
header h1 { font-size: 1.7rem; color: #ffffff; font-weight: 700; margin-bottom: 6px; }
header p { color: var(--teya-gold); font-size: 1rem; font-weight: 500; }
.form-section-luxury { background: #ffffff; border-radius: 16px; padding: 35px; box-shadow: var(--card-shadow); border: 1px solid rgba(226, 232, 240, 0.8); }
.form-title { font-size: 1.2rem; margin-bottom: 25px; color: var(--teya-navy); font-weight: 700; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
.form-title::before { content: '✦'; color: var(--teya-gold); }
.form-group { margin-bottom: 22px; }
label { display: block; margin-bottom: 8px; font-weight: 700; color: var(--teya-navy); font-size: 0.95rem; }
input, select, textarea { width: 100%; padding: 14px 18px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 1rem; outline: none; transition: all 0.3s ease; background-color: #f8fafc; color: var(--teya-navy); }
textarea { height: 90px; resize: none; }
input:focus, select:focus, textarea:focus { border-color: var(--teya-gold); box-shadow: 0 0 0 3px rgba(242, 190, 92, 0.15); background-color: #ffffff; }
.btn-luxury { background: linear-gradient(135deg, var(--teya-navy), #1a4a75); color: white; border: 1px solid var(--teya-gold); padding: 16px 30px; border-radius: 10px; font-size: 1.1rem; font-weight: 700; cursor: pointer; width: 100%; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(14, 49, 80, 0.15); margin-top: 10px; }
.btn-luxury:hover { background: var(--teya-gold); color: var(--teya-navy); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(242, 190, 92, 0.25); }
</style>
</head>
<body>
<div class="container">
<header>
<h1>سنتر TEYA لطب الأسنان</h1>
<p>قسم الاستقبال وتوجيه المراجعين سحابياً</p>
</header>
<div class="form-section-luxury">
<div class="form-title">تسجيل وحجز مراجع جديد فوري</div>
<div class="form-group">
<label>اسم المراجع الثلاثي:</label>
<input type="text" id="patientName" placeholder="أدخل اسم المريض هنا...">
</div>
<div class="form-group">
<label>رقم الهاتف المباشر:</label>
<input type="tel" id="patientPhone" placeholder="أدخل رقم هاتف المراجع...">
</div>
<div class="form-group">
<label>تاريخ ووقت الموعد الفعلي:</label>
<input type="datetime-local" id="appointmentDateTime">
</div>
<div class="form-group">
<label>التفاصيل / حالة المراجع المكتوبة يدوياً:</label>
<textarea id="patientDetails" placeholder="اكتب هنا ملاحظات الاستقبال الأولية..."></textarea>
</div>
<div class="form-group">
<label>توجيه المراجع لعيادة الطبيب المختص:</label>
<select id="doctorSelect">
<option value="doctor_1">د. احمد</option>
<option value="doctor_2">د. عبدالله</option>
<option value="doctor_3">د. طه</option>
<option value="doctor_4">د. يوسف</option>
</select>
</div>
<button class="btn-luxury" id="btnSend">تأكيد الحجز ومزامنة المريض فوراً ◀</button>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const firebaseConfig = {
apiKey: "AIzaSyCB-nA5mDW3_0t-EsX7N1RGMbzRnn2FRus",
authDomain: "teya-center.firebaseapp.com",
projectId: "teya-center",
storageBucket: "teya-center.firebasestorage.app",
messagingSenderId: "186785039764",
appId: "1:186785039764:web:469ec4294bd814dadffb81"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window.addEventListener('DOMContentLoaded', () => {
const now = new Date();
now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
document.getElementById('appointmentDateTime').value = now.toISOString().slice(0, 16);
});
document.getElementById('btnSend').addEventListener('click', async () => {
const name = document.getElementById('patientName').value.trim();
const phone = document.getElementById('patientPhone').value.trim();
const dateTime = document.getElementById('appointmentDateTime').value;
const details = document.getElementById('patientDetails').value.trim();
const docId = document.getElementById('doctorSelect').value;
if (name === "") {
alert("يرجى إدخال اسم المراجع أولاً لإتمام الحجز بنجاح");
return;
}
try {
const formattedDate = dateTime.replace('T', ' ');
await addDoc(collection(db, "appointments"), {
patient_name: name,
patient_phone: phone,
appointment_time: formattedDate,
secretary_details: details,
doctor_id: docId,
status: "waiting",
notes: "",
timestamp: serverTimestamp()
});
alert("تم تحويل المراجع ومزامنة البيانات مع العيادة بنجاح!");
document.getElementById('patientName').value = "";
document.getElementById('patientPhone').value = "";
document.getElementById('patientDetails').value = "";
} catch (error) {
// هذا السطر سيظهر لك سبب المشكلة بالضبط إذا لم يرسل
alert("حدث خطأ أثناء الإرسال: " + error.message);
console.error(error);
}
});
</script>
</body>
</html>
